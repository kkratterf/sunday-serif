# Groups the auto-generated release notes by PR label.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Disegno
      labels:
        - design
    - title: Effetti
      labels:
        - effects
    - title: Correzioni
      labels:
        - bug
    - title: Sito
      labels:
        - site
    - title: CI e strumenti
      labels:
        - ci
    - title: Altro
      labels:
        - "*"
