name: Release

# Runs by itself when a push to main changes VERSION, that is when the
# `chore(release): vX.Y.Z` bump PR is merged: if the tag vX.Y.Z does not
# exist yet, it publishes that version. A version with a suffix
# (0.3.0-beta.1) becomes a pre-release. Pushes whose tag already exists
# publish nothing, and so do development versions (X.Y.Z-dev, the value
# VERSION has between releases). A push that changes this workflow runs it too, so merging
# the fix for a failed release retries it.
#
# It can also be started by hand (workflow_dispatch) with the version to
# publish, for a dry run or to retry a failed release. The version must
# already be in VERSION.
#
# Publishes SundaySerif-<version>.zip and SHA256SUMS.txt, with release notes
# grouped by PR label (.github/release.yml).
#
# Dry run (dry_run: true): builds and checks everything and uploads the zip
# and the notes as the "sunday-serif-<version>-dry-run" artifact; creates no
# tag and no release.
on:
  push:
    branches: [main]
    paths: [VERSION, .github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.2.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run: build and check everything, publish nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Decide what to release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
            dry_run="$INPUT_DRY_RUN"
            publish=true
          else
            version=$(tr -d '[:space:]' < VERSION)
            dry_run=false
            if [[ "$version" == *-dev ]]; then
              publish=false
              echo "::notice::VERSION is $version, a development version: nothing to publish"
            elif git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              publish=false
              echo "::notice::v$version is already released: nothing to publish"
            else
              publish=true
              echo "::notice::VERSION is $version and v$version does not exist yet: publishing it"
            fi
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "dry_run=${dry_run:-false}"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  release:
    name: ${{ needs.plan.outputs.dry_run == 'true' && 'Dry run (publishes nothing)' || 'Build, tag and publish' }}
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a SemVer version (expected X.Y.Z)"
            exit 1
          fi
          file_version=$(tr -d '[:space:]' < VERSION)
          if [ "$file_version" != "$VERSION" ]; then
            echo "::error::VERSION says $file_version, but the release asks for $VERSION. Merge a version bump first."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build the fonts
        run: make build

      - name: fontbakery
        run: make test

      - name: Zip the release
        run: |
          name="SundaySerif-$VERSION"
          mkdir -p "dist/$name"
          cp -R fonts/variable fonts/ttf fonts/otf fonts/webfonts fonts/blur "dist/$name/"
          cp OFL.txt FONTLOG.txt AUTHORS.txt README.md "dist/$name/"
          (cd dist && zip -qr "$name.zip" "$name" && shasum -a 256 "$name.zip" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
          unzip -l "dist/$name.zip"

      # Explicitly from .github/release.yml, so the notes are grouped by PR label.
      - name: Generate the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            -f configuration_file_path=.github/release.yml \
            --jq .body > dist/release-notes.md
          cat dist/release-notes.md

      - name: Create the release
        if: needs.plan.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" \
            "dist/SundaySerif-$VERSION.zip" \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file dist/release-notes.md \
            "${flags[@]}"

      - name: Summary
        if: always()
        env:
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
        run: |
          fence='```'
          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "## Sunday Serif $TAG: dry run"
              echo
              echo "Nothing was published: no tag, no release. The zip is in the workflow artifacts."
            else
              echo "## Sunday Serif $TAG"
            fi
            echo
            if [ -f dist/SHA256SUMS.txt ]; then
              echo "### SHA256SUMS.txt"
              echo "$fence"; cat dist/SHA256SUMS.txt; echo "$fence"
            fi
            if [ -f dist/release-notes.md ]; then
              echo "### Release notes"
              echo
              cat dist/release-notes.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the dry-run files
        if: always() && needs.plan.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sunday-serif-${{ needs.plan.outputs.version }}-dry-run
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/release-notes.md
          if-no-files-found: warn
          retention-days: 14
