name: "💡 Idea: una cosa nuova"
description: A new effect, an OpenType feature, a style, or a change to the website.
labels: ["effects"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is missing
      description: What you want to do with Sunday Serif that it does not let you do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work. Sketches or references help.
    validations:
      required: true
